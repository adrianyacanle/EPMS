<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <div class="dashboard">

        <aside class="sidebar">

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="employees.html" class="active">Employees</a>
                <a href="admin-settings.html">Settings</a>
            </nav>

            <a href="login.html" class="logout">Logout</a>

        </aside>

       <main class="main-content">

    <div class="top-bar">
        <h1>Employees</h1>

        <div class="admin">
            Admin 
        </div>
    </div>

    <div class="employee-tools">

        <input
         type="text"
         id="searchEmployee"
         placeholder="Search employee..."
        >

        <button onclick="window.location.href='registration.html'">
        Add Employee
        </button>

    </div>
     <!-- EMPLOYEE TABLE -->
    <div class="employee-list">

        <h2>Employee Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Date Hired</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTableBody">

</tbody>
        </table>

    </div>

</main>
</div>

<script>
function getUsername(cell) {

    const link = cell.querySelector("a");

    if (!link) {
        return "";
    }

    const url =
        new URL(link.href);

    return url.searchParams.get("username");
}

function editEmployee(username) {

    window.location.href =
        "admin-edit-employee.html?username=" +
        encodeURIComponent(username);
}
function deleteEmployee(username) {

    const confirmDelete =
        confirm("Are you sure you want to delete this employee?");

    if (!confirmDelete) {
        return;
    }

    window.location.href =
        "/cgi-bin/web_admin_delete.exe?username=" +
        encodeURIComponent(username);
}
fetch("/cgi-bin/web_employees.exe")

    .then(response => response.text())

    .then(data => {

        const parser = new DOMParser();

        const doc =
            parser.parseFromString(data, "text/html");

        const rows =
            doc.querySelectorAll("tr");

        const tableBody =
            document.getElementById("employeeTableBody");

        rows.forEach(function(row) {

    const cells = row.querySelectorAll("td");

    if (cells.length === 5) {

        const newRow = document.createElement("tr");

        const username = getUsername(cells[4]);

        newRow.innerHTML = `
    <td>${cells[0].textContent}</td>
    <td>${cells[1].textContent}</td>
    <td>${cells[2].textContent}</td>
    <td>${cells[3].textContent}</td>
    <td class="action-buttons">
    <a
        href="employee-profile.html?username=${encodeURIComponent(username)}"
        class="view-btn"
    >
        View
    </a>

    <button
        class="edit-btn"
        onclick="editEmployee('${username}')"
    >
        Edit
    </button>

    <button
        class="delete-btn"
        onclick="deleteEmployee('${username}')"
    >
        Delete
    </button>
</td>
`;

        tableBody.appendChild(newRow);
    }
});

    })

    .catch(function(error) {

        console.error(
            "Error loading employees:",
            error
        );

    });

</script>
<script>

document.getElementById("searchEmployee")
    .addEventListener("keyup", function() {

        const searchValue =
            this.value.toLowerCase();

        const rows =
            document.querySelectorAll(
                "#employeeTableBody tr"
            );

        rows.forEach(function(row) {

            const rowText =
                row.textContent.toLowerCase();

            if (rowText.includes(searchValue)) {

                row.style.display = "";

            } else {

                row.style.display = "none";

            }

        });

    });

</script>
</body>
</html>

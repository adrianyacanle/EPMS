<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <div class="dashboard">

        <aside class="sidebar">


            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="employees.html" class="active">Employees</a>
                <a href="admin-settings.html">Settings</a>
            </nav>

            <a href="login.html" class="logout">Logout</a>

        </aside>

        <main class="main-content">

            <div class="top-bar">
                <h1>Employee Profile</h1>

                <div class="employee">
                    Employee
                </div>
            </div>

            <div class="profile-card">

                <h2>Employee Information</h2>

                <p><strong>Employee ID:</strong> <span id="employeeID">Loading...</span></p>
                <p><strong>Name:</strong> <span id="name">Loading...</span></p>
                <p><strong>Department:</strong> <span id="department">Loading...</span></p>
                <p><strong>Date Hired:</strong> <span id="dateHired">Loading...</span></p>
                <p><strong>Email:</strong> <span id="email">Loading...</span></p>
                <p><strong>Contact Number:</strong> <span id="contactNumber">Loading...</span></p>

                <div class="profile-actions">

    <button class="edit-profile-btn"
    onclick="editEmployee()"
>
    Edit Employee
</button>

    <a href="employees.html" class="back-btn">
        Back to Employees
    </a>

</div>

            </div>

        </main>

    </div>

<script>

const params =
    new URLSearchParams(window.location.search);

const username =
    params.get("username");

function editEmployee() {

    if (username) {

        window.location.href =
            "admin-edit-employee.html?username=" +
            encodeURIComponent(username);

    }

}
if (username) {

    fetch(
        "/cgi-bin/web_profile.exe?username=" +
        encodeURIComponent(username)
    )

    .then(response => response.text())

    .then(data => {

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(data, "text/html");

        const paragraphs =
            doc.querySelectorAll("p");

        paragraphs.forEach(function(p) {

            const text =
                p.textContent.trim();

            if (text.includes("Employee ID:")) {
                document.getElementById("employeeID").textContent =
                    text.replace("Employee ID:", "").trim();
            }

            if (text.includes("Name:")) {
                document.getElementById("name").textContent =
                    text.replace("Name:", "").trim();
            }

            if (text.includes("Department:")) {
                document.getElementById("department").textContent =
                    text.replace("Department:", "").trim();
            }

            if (text.includes("Date Hired:")) {
                document.getElementById("dateHired").textContent =
                    text.replace("Date Hired:", "").trim();
            }

            if (text.includes("Email:")) {
                document.getElementById("email").textContent =
                    text.replace("Email:", "").trim();
            }

            if (text.includes("Contact Number:")) {
                document.getElementById("contactNumber").textContent =
                    text.replace("Contact Number:", "").trim();
            }

        });

    })

    .catch(function(error) {

        console.error(
            "Error loading employee profile:",
            error
        );

    });

}

</script>

</body>
</html>
